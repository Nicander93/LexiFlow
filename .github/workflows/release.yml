name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

jobs:
  windows:
    name: Build Windows artifacts
    if: github.ref_type != 'tag'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Clean release output
        run: if (Test-Path release) { Remove-Item release -Recurse -Force }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pnpm run dist:win:all 2>&1 | Tee-Object -FilePath artifacts/dist-win.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LexiFlow-Packaging-Diagnostics
          path: |
            artifacts/dist-win.log
            release/builder-debug.yml
            release/builder-effective-config.yaml
          if-no-files-found: ignore

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LexiFlow-Windows
          path: |
            release/LexiFlow-*-Setup.exe
            release/LexiFlow-*-Portable.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts from main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release

          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow Release \
              --branch main \
              --commit "$TAG_SHA" \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' \
              | head -n 1)"

            if [ -n "$run_id" ]; then
              break
            fi

            sleep 30
          done

          if [ -z "$run_id" ]; then
            echo "No successful main Release workflow run found for $TAG_SHA."
            exit 1
          fi

          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name LexiFlow-Windows \
            --dir release

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f \( \
            -name 'LexiFlow-*-Setup.exe' -o \
            -name 'LexiFlow-*-Portable.exe' -o \
            -name '*.blockmap' -o \
            -name 'latest.yml' \
          \))

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found in downloaded artifact."
            exit 1
          fi

          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$GITHUB_REF_NAME"

          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
