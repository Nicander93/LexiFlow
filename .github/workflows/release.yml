name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Clean release output
        run: if (Test-Path release) { Remove-Item release -Recurse -Force }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pnpm run dist:win:all 2>&1 | Tee-Object -FilePath artifacts/dist-win.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LexiFlow-Packaging-Diagnostics
          path: |
            artifacts/dist-win.log
            release/builder-debug.yml
            release/builder-effective-config.yaml
          if-no-files-found: ignore

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LexiFlow-Windows
          path: |
            release/LexiFlow-*-Setup.exe
            release/LexiFlow-*-Portable.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            Get-ChildItem -File -ErrorAction SilentlyContinue -Path @(
              "release/LexiFlow-*-Setup.exe"
              "release/LexiFlow-*-Portable.exe"
              "release/*.blockmap"
              "release/latest.yml"
            ) | Select-Object -ExpandProperty FullName
          )

          if ($files.Count -eq 0) {
            throw "No release files found from the current tag build."
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $env:GITHUB_REF_NAME $files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
