name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Clean release output
        run: if (Test-Path release) { Remove-Item release -Recurse -Force }

      - name: Build installer and portable package
        run: pnpm run dist:win:all

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LexiFlow-Windows
          path: |
            release/LexiFlow-*-Setup.exe
            release/LexiFlow-*-Portable.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/LexiFlow-*-Setup.exe
            release/LexiFlow-*-Portable.exe
            release/*.blockmap
            release/latest.yml
